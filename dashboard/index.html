<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fleet</title>
<style>
  :root {
    --bg: #101216;
    --surface: #171a20;
    --surface-2: #1f232b;
    --border: #2a2f3a;
    --ink: #e7eaf0;
    --ink-2: #9aa3b2;
    --ink-3: #6b7383;
    --accent: #7aa2f7;
    --good: #4ade80;
    --run: #60a5fa;
    --warn: #fbbf24;
    --bad: #f87171;
    --user-bubble: #23304d;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
    flex: none;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  header .conn { margin-left: auto; font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .dot.on { background: var(--good); }
  .dot.off { background: var(--bad); }
  .dot.run { background: var(--run); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  main { flex: 1; display: flex; min-height: 0; position: relative; }

  /* ---- 가운데 보드 (PC/프로젝트/세션 목록 — 항상 펼쳐짐) ---- */
  #board { flex: 1; min-width: 0; overflow-y: auto; padding: 18px 20px; }
  #board .wrap { max-width: 1200px; margin: 0 auto; }
  #board-top { display: flex; gap: 10px; margin-bottom: 14px; }
  #search {
    flex: 1; max-width: 420px; background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 13px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #pc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; align-items: start; }
  .pc { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden; }
  .pc-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .pc-head .name { font-weight: 700; font-size: 14.5px; }
  .pc-head .meta { margin-left: auto; font-size: 11px; color: var(--ink-3); }
  .pc-head .shot {
    flex: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
    border-radius: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer;
  }
  .pc-head .shot:hover { border-color: var(--accent); }
  .pc-head .shot:disabled { opacity: .35; cursor: default; }
  #screen-dialog { width: min(1200px, 96vw); }
  #screen-dialog .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
  #screen-dialog .bar b { color: var(--ink); }
  #screen-dialog .bar button {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
    border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px;
  }
  #screen-dialog .bar button:hover { border-color: var(--accent); }
  #screen-img { width: 100%; border-radius: 8px; border: 1px solid var(--border); background: #000; min-height: 200px; }
  #screen-status { font-size: 12px; color: var(--ink-3); }
  .pc-body { padding: 6px 8px 10px; }
  .group { padding: 8px 8px 3px; font-size: 11px; color: var(--ink-3); letter-spacing: .3px; }
  .proj { display: flex; align-items: center; gap: 6px; padding: 5px 8px; font-size: 12.5px; color: var(--ink-2); border-radius: 8px; }
  .proj:hover { background: var(--surface-2); }
  .proj > span:first-child { white-space: nowrap; }
  .proj .path { flex: 1; min-width: 0; color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj button {
    flex: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
    border-radius: 6px; font-size: 11.5px; padding: 2px 8px; cursor: pointer;
  }
  .proj button:hover { border-color: var(--accent); }
  .sess {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px; margin: 2px 0;
    border-radius: 8px; cursor: pointer; font-size: 12.5px;
  }
  .sess:hover { background: var(--surface-2); }
  .sess.active { background: var(--surface-2); outline: 1px solid var(--accent); }
  .sess .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .pill {
    flex: none; display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--ink-2); background: var(--bg);
  }
  .unread {
    flex: none; background: var(--accent); color: #0b1020; font-weight: 700;
    font-size: 10px; border-radius: 999px; padding: 1px 6px; min-width: 18px; text-align: center;
  }
  .eng { flex: none; font-size: 9.5px; font-weight: 700; letter-spacing: .4px; padding: 1px 6px; border-radius: 4px; }
  .eng.claude { background: #37304d; color: #c4b5fd; }
  .eng.codex { background: #16382f; color: #5eead4; }
  .empty { color: var(--ink-3); font-size: 13px; padding: 24px; text-align: center; }

  /* ---- 대화 패널 (세션 클릭 시 오른쪽에서 열림, ✕ 로 닫힘) ---- */
  #panel {
    width: min(640px, 100%); flex: none; display: none; flex-direction: column; min-height: 0;
    border-left: 1px solid var(--border); background: var(--surface);
  }
  body.panel-open #panel { display: flex; }
  @media (max-width: 1100px) {
    #panel { position: absolute; inset: 0 0 0 auto; width: 100%; z-index: 5; box-shadow: -8px 0 24px rgba(0,0,0,.5); }
  }
  #sess-head {
    flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); font-size: 12.5px; color: var(--ink-2);
  }
  #sess-head select {
    background: var(--bg); color: var(--ink); border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px; padding: 2px 6px; max-width: 150px;
  }
  #sess-head .stop { margin-left: auto; border: 1px solid var(--border); background: var(--bg); color: var(--bad);
    border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  #sess-head .close {
    border: 1px solid var(--border); background: var(--bg); color: var(--ink);
    border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 13px; line-height: 1.2;
  }
  #sess-head .close:hover { border-color: var(--accent); }
  #transcript { flex: 1; overflow-y: auto; padding: 16px; background: var(--bg); }
  #transcript .inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

  .msg { border-radius: 10px; padding: 10px 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: var(--user-bubble); align-self: flex-end; max-width: 85%; }
  .msg.assistant { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; max-width: 95%; }
  .msg.assistant.live { border-style: dashed; }
  .msg code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .msg pre { background: var(--surface-2); border-radius: 8px; padding: 10px; overflow-x: auto; margin: 6px 0; }
  .msg pre code { background: none; padding: 0; }
  .meta { align-self: center; font-size: 11.5px; color: var(--ink-3); text-align: center; }
  .tool {
    align-self: flex-start; font-family: var(--mono); font-size: 12px; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 6px 10px; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  details.result { align-self: flex-start; max-width: 95%; font-size: 12px; color: var(--ink-3); }
  details.result pre {
    font-family: var(--mono); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; margin: 4px 0 0; max-height: 240px; overflow: auto; white-space: pre-wrap;
  }
  .err { align-self: stretch; font-family: var(--mono); font-size: 12px; color: var(--bad); white-space: pre-wrap; }

  #composer { flex: none; border-top: 1px solid var(--border); background: var(--surface); padding: 12px 16px; }
  #composer .inner { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  #prompt-input {
    flex: 1; resize: none; min-height: 42px; max-height: 160px;
    background: var(--bg); color: var(--ink); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font: inherit; outline: none;
  }
  #prompt-input:focus { border-color: var(--accent); }
  #send-btn {
    flex: none; border: none; background: var(--accent); color: #0b1020; font-weight: 700;
    border-radius: 10px; padding: 10px 18px; cursor: pointer; font-size: 13.5px;
  }
  #send-btn:disabled { opacity: .4; cursor: default; }

  /* ---- 모달 ---- */
  dialog {
    background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; width: min(480px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h2 { margin: 0 0 12px; font-size: 15px; }
  dialog label { display: block; font-size: 12px; color: var(--ink-2); margin: 10px 0 4px; }
  dialog input, dialog textarea, dialog select {
    width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font: inherit;
  }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  dialog .row button { border-radius: 8px; padding: 7px 14px; font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); }
  dialog .row button.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>Claude Fleet</h1>
  <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">연결 중…</span></div>
</header>
<main>
  <div id="board">
    <div class="wrap">
      <div id="board-top"><input id="search" type="search" placeholder="PC · 프로젝트 · 세션 검색"></div>
      <div id="pc-grid"><div class="empty">허브에 연결하면 PC 목록이 표시됩니다.</div></div>
    </div>
  </div>
  <aside id="panel">
    <div id="sess-head"></div>
    <div id="transcript"><div class="inner" id="transcript-inner"></div></div>
    <div id="composer">
      <div class="inner">
        <textarea id="prompt-input" placeholder="프롬프트 입력 — Enter 전송 · Shift+Enter 줄바꿈"></textarea>
        <button id="send-btn">전송</button>
      </div>
    </div>
  </aside>
</main>

<dialog id="screen-dialog">
  <div class="bar">
    <b id="screen-pc"></b>
    <span id="screen-status"></span>
    <span style="margin-left:auto;display:flex;gap:10px;align-items:center">
      <label style="display:flex;align-items:center;gap:5px;margin:0;font-size:12px">
        <input type="checkbox" id="screen-auto"> 자동 새로고침 (5초)
      </label>
      <button id="screen-refresh">새로고침</button>
      <button id="screen-close">✕ 닫기</button>
    </span>
  </div>
  <img id="screen-img" alt="원격 화면">
</dialog>

<dialog id="token-dialog">
  <h2>허브 접속 토큰</h2>
  <label for="token-input">서버의 FLEET_TOKEN 값을 입력하세요</label>
  <input id="token-input" type="password" autocomplete="off">
  <div class="row"><button class="primary" id="token-save">접속</button></div>
</dialog>

<dialog id="new-dialog">
  <h2>새 세션 시작</h2>
  <div id="new-target" style="font-size:12.5px;color:var(--ink-2)"></div>
  <label>엔진</label>
  <div style="display:flex;gap:16px;font-size:13px">
    <label style="display:flex;align-items:center;gap:6px;margin:0">
      <input type="radio" name="engine" value="claude" checked> Claude
    </label>
    <label id="codex-option" style="display:flex;align-items:center;gap:6px;margin:0">
      <input type="radio" name="engine" value="codex" id="codex-radio"> Codex
    </label>
  </div>
  <label for="model-select">모델</label>
  <select id="model-select"></select>
  <label for="new-prompt">첫 프롬프트</label>
  <textarea id="new-prompt" rows="4" placeholder="예) 테스트 전부 돌리고 실패 원인 고쳐줘"></textarea>
  <label for="new-resume">이어갈 세션 ID (선택) — 터미널에서 /status 로 확인한 ID 를 넣으면 그 대화를 이어받습니다</label>
  <input id="new-resume" placeholder="예) 23f6d80b-175a-4be2-bf26-949b5f370d41" autocomplete="off">
  <div class="row">
    <button id="new-cancel">취소</button>
    <button class="primary" id="new-start">시작</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const STATUS_LABEL = {
  starting: ['시작 중', 'run'], running: ['실행 중', 'run'], idle: ['대기', 'on'],
  stopped: ['중지됨', 'off'], exited: ['종료됨', ''], error: ['오류', 'off'],
};
const FALLBACK_MODELS = { claude: ['fable', 'opus', 'sonnet', 'haiku'], codex: [] };

let ws = null;
let token = null;
let fleet = [];
let selected = null;                  // {pc, sessionKey}
let liveBubbles = new Map();
let newTarget = null;
let searchQuery = '';
const unread = new Map();             // `${pc}/${key}` -> 안 본 새 활동 수
const uKey = (pc, key) => `${pc}/${key}`;
let boardTimer = null;
function scheduleBoard() {
  if (boardTimer) return;
  boardTimer = setTimeout(() => { boardTimer = null; renderBoard(); }, 200);
}
function updateTitle() {
  let n = 0;
  for (const v of unread.values()) n += v;
  document.title = (n ? `(${n}) ` : '') + 'Claude Fleet';
}

// 딥링크: #s=<PC>/<세션키> 로 열면 해당 세션 패널이 자동으로 열린다
let pendingHash = (() => {
  const m = location.hash.match(/^#s=([^/]+)\/([0-9a-f]{8})$/);
  return m ? { pc: decodeURIComponent(m[1]), key: m[2] } : null;
})();
if (pendingHash) setTimeout(() => { pendingHash = null; }, 20000);

try { token = localStorage.getItem('fleet_token'); } catch {}

function askToken() { $('token-dialog').showModal(); }
$('token-save').addEventListener('click', () => {
  token = $('token-input').value.trim();
  if (!token) return;
  try { localStorage.setItem('fleet_token', token); } catch {}
  $('token-dialog').close();
  connect();
});

function setConn(state, text) {
  $('conn-dot').className = 'dot ' + state;
  $('conn-text').textContent = text;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?role=dashboard&token=${encodeURIComponent(token)}`);
  setConn('', '연결 중…');
  ws.onopen = () => {
    setConn('on', '허브 연결됨');
    if (selected) subscribe(selected.pc, selected.sessionKey);
  };
  ws.onclose = (e) => {
    if (e.code === 4401) {
      setConn('off', '토큰이 올바르지 않습니다');
      try { localStorage.removeItem('fleet_token'); } catch {}
      askToken();
      return;
    }
    setConn('off', '연결 끊김 — 3초 후 재시도');
    setTimeout(connect, 3000);
  };
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === 'fleet') {
      fleet = msg.pcs;
      renderBoard();
      renderSessHead();
      if (pendingHash) {
        const pc = fleet.find((p) => p.name === pendingHash.pc);
        if (pc && (pc.sessions || []).some((s) => s.key === pendingHash.key)) {
          const { pc: hp, key } = pendingHash;
          pendingHash = null;
          selectSession(hp, key);
        }
      }
    }
    else if (msg.type === 'history') {
      if (selected && msg.pc === selected.pc && msg.sessionKey === selected.sessionKey) {
        $('transcript-inner').innerHTML = '';
        liveBubbles.delete(msg.sessionKey);
        for (const ev of msg.events) renderEvent(msg.sessionKey, ev);
        scrollBottom(true);
      }
    }
    else if (msg.type === 'event') {
      if (selected && msg.pc === selected.pc && msg.sessionKey === selected.sessionKey) {
        renderEvent(msg.sessionKey, msg.event);
        scrollBottom();
      } else if (['assistant', 'result', 'stderr'].includes(msg.event?.type)) {
        // 안 보고 있는 세션의 새 활동 → 배지 카운트
        const k = uKey(msg.pc, msg.sessionKey);
        unread.set(k, (unread.get(k) || 0) + 1);
        updateTitle();
        scheduleBoard();
      }
    }
    else if (msg.type === 'screenshot_data') { onScreenshot(msg); }
    else if (msg.type === 'error') { alert(msg.message); }
  };
}

function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}
function subscribe(pc, sessionKey) {
  send({ type: 'subscribe', pc, sessionKey });
}

/* ---------- 가운데 보드 (항상 펼쳐진 목록) ---------- */
$('search').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  renderBoard();
});

function timeAgo(ts) {
  if (!ts) return '';
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return `${m}분 전`;
  return `${Math.round(m / 60)}시간 전`;
}

function renderBoard() {
  const grid = $('pc-grid');
  grid.innerHTML = '';
  if (!fleet.length) {
    grid.innerHTML = '<div class="empty">접속한 PC 가 없습니다. 각 PC 에서 에이전트를 실행하세요: <code>npm run agent</code></div>';
    return;
  }
  const q = searchQuery;
  let shown = 0;
  for (const pc of fleet) {
    let projects = pc.projects || [];
    let sessList = (pc.sessions || []).slice().sort((a, b) => b.updatedAt - a.updatedAt);
    const pcMatch = pc.name.toLowerCase().includes(q);
    if (q && !pcMatch) {
      projects = projects.filter((p) => p.name.toLowerCase().includes(q));
      sessList = sessList.filter((s) => `${s.project} ${s.title || ''}`.toLowerCase().includes(q));
      if (!projects.length && !sessList.length) continue;
    }
    shown++;
    const running = sessList.filter((s) => s.status === 'running' || s.status === 'starting').length;

    const el = document.createElement('div');
    el.className = 'pc';
    const head = document.createElement('div');
    head.className = 'pc-head';
    const dot = document.createElement('span');
    dot.className = `dot ${pc.online ? (running ? 'run' : 'on') : 'off'}`;
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = pc.name;
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = pc.online
      ? `온라인 · 세션 ${sessList.length}${running ? ` · 실행 ${running}` : ''}`
      : `오프라인 · ${timeAgo(pc.lastSeen)}`;
    const shotBtn = document.createElement('button');
    shotBtn.className = 'shot';
    shotBtn.textContent = '🖥 화면';
    shotBtn.title = '이 PC 의 실제 화면 보기';
    shotBtn.disabled = !pc.online;
    shotBtn.onclick = () => openScreen(pc.name);
    head.append(dot, name, meta, shotBtn);
    el.appendChild(head);

    const body = document.createElement('div');
    body.className = 'pc-body';

    const gp = document.createElement('div');
    gp.className = 'group';
    gp.textContent = `프로젝트 (${projects.length})`;
    body.appendChild(gp);
    for (const proj of projects) {
      const row = document.createElement('div');
      row.className = 'proj';
      const nm = document.createElement('span'); nm.textContent = '📁 ' + proj.name;
      const pt = document.createElement('span'); pt.className = 'path'; pt.textContent = proj.path;
      const btn = document.createElement('button'); btn.textContent = '새 세션';
      btn.disabled = !pc.online;
      btn.onclick = () => openNewDialog(pc.name, proj.name);
      row.append(nm, pt, btn);
      body.appendChild(row);
    }

    const gs = document.createElement('div');
    gs.className = 'group';
    gs.textContent = `세션 (${sessList.length})`;
    body.appendChild(gs);
    for (const s of sessList) {
      const [label, dotCls] = STATUS_LABEL[s.status] || [s.status, ''];
      const row = document.createElement('div');
      row.className = 'sess' + (selected && selected.pc === pc.name && selected.sessionKey === s.key ? ' active' : '');
      const pill = document.createElement('span');
      pill.className = 'pill';
      pill.innerHTML = `<span class="dot ${dotCls}"></span>`;
      pill.append(label);
      const eng = document.createElement('span');
      eng.className = 'eng ' + (s.engine || 'claude');
      eng.textContent = s.engine === 'codex' ? 'CODEX' : 'CLAUDE';
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = `${s.project} · ${s.title || s.key}`;
      row.append(pill, eng, title);
      const uc = unread.get(uKey(pc.name, s.key));
      if (uc) {
        const badge = document.createElement('span');
        badge.className = 'unread';
        badge.textContent = uc > 99 ? '99+' : String(uc);
        row.appendChild(badge);
      }
      row.onclick = () => selectSession(pc.name, s.key);
      body.appendChild(row);
    }
    el.appendChild(body);
    grid.appendChild(el);
  }
  if (q && !shown) grid.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
}

/* ---------- 대화 패널 열기/닫기 ---------- */
function openPanel() { document.body.classList.add('panel-open'); }
function closePanel() {
  document.body.classList.remove('panel-open');
  selected = null;
  try { history.replaceState(null, '', location.pathname); } catch {}
  renderBoard();
}

function selectSession(pc, sessionKey) {
  selected = { pc, sessionKey };
  unread.delete(uKey(pc, sessionKey));
  updateTitle();
  try { history.replaceState(null, '', `#s=${encodeURIComponent(pc)}/${sessionKey}`); } catch {}
  openPanel();
  $('transcript-inner').innerHTML = '<div class="meta">불러오는 중…</div>';
  renderBoard();
  renderSessHead();
  subscribe(pc, sessionKey);
  $('prompt-input').focus();
}

function currentSession() {
  if (!selected) return null;
  const pc = fleet.find((p) => p.name === selected.pc);
  return pc ? (pc.sessions || []).find((s) => s.key === selected.sessionKey) : null;
}

function renderSessHead() {
  if (!selected) return;
  const s = currentSession();
  const head = $('sess-head');
  head.innerHTML = '';
  const [label, dotCls] = s ? (STATUS_LABEL[s.status] || [s.status, '']) : ['알 수 없음', ''];
  const pill = document.createElement('span');
  pill.className = 'pill';
  pill.innerHTML = `<span class="dot ${dotCls}"></span>`;
  pill.append(label);

  const t = document.createElement('span');
  t.textContent = `${selected.pc} / ${s ? s.project : ''} — ${s && s.sessionId ? s.sessionId.slice(0, 8) : selected.sessionKey}`;

  const pcInfo = fleet.find((p) => p.name === selected.pc);

  // 진행 중 엔진 전환: 이전 대화는 에이전트가 자동으로 인수인계
  const engSel = document.createElement('select');
  engSel.title = '엔진 변경 — 이전 대화가 자동으로 인수인계됩니다';
  for (const [val, lbl] of [['claude', 'Claude'], ['codex', 'Codex']]) {
    const o = document.createElement('option');
    o.value = val;
    o.textContent = lbl;
    if (val === 'codex' && !(pcInfo?.engines || []).includes('codex')) o.disabled = true;
    engSel.appendChild(o);
  }
  engSel.value = s?.engine || 'claude';
  engSel.onchange = () => send({ type: 'set_engine', pc: selected.pc, sessionKey: selected.sessionKey, engine: engSel.value });

  // 진행 중 모델 변경: Claude 는 --resume 재시작, Codex 는 다음 턴부터 적용
  const modelSel = document.createElement('select');
  modelSel.title = '모델 변경 (다음 턴부터 적용)';
  const engineName = s?.engine || 'claude';
  const models = pcInfo?.models?.[engineName] || FALLBACK_MODELS[engineName] || [];
  const list = s?.model && !models.includes(s.model) ? [s.model, ...models] : models;
  const defOpt = document.createElement('option');
  defOpt.value = '';
  defOpt.textContent = '기본 모델';
  modelSel.appendChild(defOpt);
  for (const m of list) {
    const o = document.createElement('option');
    o.value = m;
    o.textContent = m;
    modelSel.appendChild(o);
  }
  modelSel.value = s?.model || '';
  modelSel.onchange = () => send({ type: 'set_model', pc: selected.pc, sessionKey: selected.sessionKey, model: modelSel.value || null });

  const stop = document.createElement('button');
  stop.className = 'stop';
  const ended = ['stopped', 'exited', 'error'].includes(s?.status);
  if (ended) {
    // 끝난 세션은 목록에서 정리 (대화 기록은 허브의 fleet-memory 에 남음)
    stop.textContent = '목록에서 제거';
    stop.onclick = () => {
      send({ type: 'remove_session', pc: selected.pc, sessionKey: selected.sessionKey });
      unread.delete(uKey(selected.pc, selected.sessionKey));
      updateTitle();
      closePanel();
    };
  } else {
    stop.textContent = '세션 중지';
    stop.onclick = () => send({ type: 'stop_session', pc: selected.pc, sessionKey: selected.sessionKey });
  }

  const close = document.createElement('button');
  close.className = 'close';
  close.title = '패널 닫기';
  close.textContent = '✕';
  close.onclick = closePanel;

  head.append(pill, engSel, t, modelSel, stop, close);
}

/* ---------- 트랜스크립트 렌더링 ---------- */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function add(node) { $('transcript-inner').appendChild(node); }

function fmtText(container, text) {
  // 최소한의 마크다운: ```코드블록``` 과 `인라인 코드`
  const parts = String(text).split(/```/);
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.textContent = part.replace(/^[a-z]*\n/, '');
      pre.appendChild(code);
      container.appendChild(pre);
    } else {
      part.split(/(`[^`]+`)/).forEach((seg) => {
        if (seg.startsWith('`') && seg.endsWith('`')) container.appendChild(el('code', null, seg.slice(1, -1)));
        else container.appendChild(document.createTextNode(seg));
      });
    }
  });
}

function toolSummary(block) {
  const inp = block.input || {};
  const hint = inp.command || inp.file_path || inp.pattern || inp.prompt || inp.description || '';
  return `🔧 ${block.name}  ${String(hint).slice(0, 120)}`;
}

function renderEvent(sessionKey, ev) {
  switch (ev.type) {
    case 'user_input': {
      dropLive(sessionKey);
      const m = el('div', 'msg user');
      fmtText(m, ev.text);
      add(m);
      break;
    }
    case 'assistant': {
      dropLive(sessionKey);
      for (const block of ev.message?.content || []) {
        if (block.type === 'text' && block.text.trim()) {
          const m = el('div', 'msg assistant');
          fmtText(m, block.text);
          add(m);
        } else if (block.type === 'tool_use') {
          add(el('div', 'tool', toolSummary(block)));
        }
      }
      break;
    }
    case 'user': {
      for (const block of ev.message?.content || []) {
        if (block.type === 'tool_result') {
          const text = typeof block.content === 'string'
            ? block.content
            : (block.content || []).map((c) => c.text || '').join('\n');
          if (!text.trim()) break;
          const d = el('details', 'result');
          d.appendChild(el('summary', null, block.is_error ? '⚠ 도구 결과 (오류)' : '도구 결과'));
          d.appendChild(el('pre', null, text.slice(0, 4000)));
          add(d);
        }
      }
      break;
    }
    case 'stream_event': {
      const delta = ev.event?.delta;
      if (delta?.type === 'text_delta') {
        let live = liveBubbles.get(sessionKey);
        if (!live || !live.isConnected) {
          live = el('div', 'msg assistant live');
          liveBubbles.set(sessionKey, live);
          add(live);
        }
        live.textContent += delta.text;
      }
      break;
    }
    case 'system': {
      if (ev.subtype === 'init') {
        add(el('div', 'meta', `세션 시작 · ${ev.model || ''} · ${(ev.session_id || '').slice(0, 8)}`));
      }
      break;
    }
    case 'result': {
      dropLive(sessionKey);
      const secs = ev.duration_ms ? (ev.duration_ms / 1000).toFixed(1) + 's' : '';
      const cost = ev.total_cost_usd != null ? '$' + ev.total_cost_usd.toFixed(4) : '';
      const toks = ev.usage && (ev.usage.input_tokens || ev.usage.output_tokens)
        ? `${ev.usage.input_tokens || 0}↑ ${ev.usage.output_tokens || 0}↓ 토큰` : '';
      add(el('div', 'meta', `— 턴 완료 ${[secs, cost, toks, ev.num_turns > 1 ? ev.num_turns + '턴' : ''].filter(Boolean).join(' · ')} —`));
      break;
    }
    case 'stderr':
      add(el('div', 'err', ev.text));
      break;
    case 'agent':
      add(el('div', 'meta', ev.text));
      break;
    default:
      break;
  }
}

function dropLive(sessionKey) {
  const live = liveBubbles.get(sessionKey);
  if (live) { live.remove(); liveBubbles.delete(sessionKey); }
}

let stickBottom = true;
$('transcript').addEventListener('scroll', () => {
  const t = $('transcript');
  stickBottom = t.scrollTop + t.clientHeight >= t.scrollHeight - 60;
});
function scrollBottom(force) {
  if (force || stickBottom) $('transcript').scrollTop = $('transcript').scrollHeight;
}

/* ---------- 프롬프트 전송 ---------- */
function sendPrompt() {
  const text = $('prompt-input').value.trim();
  if (!text || !selected) return;
  send({ type: 'prompt', pc: selected.pc, sessionKey: selected.sessionKey, text });
  $('prompt-input').value = '';
  $('prompt-input').style.height = '';
}
$('send-btn').addEventListener('click', sendPrompt);
$('prompt-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendPrompt();
  }
});
$('prompt-input').addEventListener('input', (e) => {
  e.target.style.height = '';
  e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px';
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.body.classList.contains('panel-open')) closePanel();
});

/* ---------- 원격 화면 보기 ---------- */
let screenPc = null;
let screenTimer = null;

function requestShot() {
  if (screenPc) send({ type: 'screenshot', pc: screenPc });
}
function openScreen(pc) {
  screenPc = pc;
  $('screen-pc').textContent = pc;
  $('screen-status').textContent = '캡처 요청 중…';
  $('screen-img').removeAttribute('src');
  $('screen-dialog').showModal();
  requestShot();
  syncScreenTimer();
}
function closeScreen() {
  screenPc = null;
  if (screenTimer) { clearInterval(screenTimer); screenTimer = null; }
  $('screen-dialog').close();
}
function syncScreenTimer() {
  if (screenTimer) { clearInterval(screenTimer); screenTimer = null; }
  if ($('screen-auto').checked && screenPc) screenTimer = setInterval(requestShot, 5000);
}
function onScreenshot(msg) {
  if (!screenPc || msg.pc !== screenPc) return;
  if (msg.error) {
    $('screen-status').textContent = msg.error;
    return;
  }
  $('screen-img').src = `data:${msg.mime || 'image/jpeg'};base64,${msg.image}`;
  $('screen-status').textContent = `캡처 시각 ${new Date(msg.ts).toLocaleTimeString()}`;
}
$('screen-refresh').addEventListener('click', requestShot);
$('screen-close').addEventListener('click', closeScreen);
$('screen-auto').addEventListener('change', syncScreenTimer);
$('screen-dialog').addEventListener('close', () => { if (screenPc) closeScreen(); });

/* ---------- 새 세션 ---------- */
function fillModelSelect() {
  if (!newTarget) return;
  const pcInfo = fleet.find((p) => p.name === newTarget.pc);
  const engine = document.querySelector('input[name=engine]:checked')?.value || 'claude';
  const models = pcInfo?.models?.[engine] || FALLBACK_MODELS[engine] || [];
  const sel = $('model-select');
  sel.innerHTML = '';
  const def = document.createElement('option');
  def.value = '';
  def.textContent = '기본 모델';
  sel.appendChild(def);
  for (const m of models) {
    const o = document.createElement('option');
    o.value = m;
    o.textContent = m;
    sel.appendChild(o);
  }
}
document.querySelectorAll('input[name=engine]').forEach((r) => r.addEventListener('change', fillModelSelect));

function openNewDialog(pc, project) {
  newTarget = { pc, project };
  $('new-target').textContent = `${pc} / ${project}`;
  $('new-prompt').value = '';
  $('new-resume').value = '';
  const pcInfo = fleet.find((p) => p.name === pc);
  const hasCodex = (pcInfo?.engines || ['claude']).includes('codex');
  $('codex-radio').disabled = !hasCodex;
  $('codex-option').style.opacity = hasCodex ? '1' : '.35';
  $('codex-option').title = hasCodex ? '' : '이 PC 의 에이전트 설정에 engines.codex 가 없습니다';
  if (!hasCodex) document.querySelector('input[name=engine][value=claude]').checked = true;
  fillModelSelect();
  $('new-dialog').showModal();
  $('new-prompt').focus();
}
$('new-cancel').addEventListener('click', () => $('new-dialog').close());
$('new-start').addEventListener('click', () => {
  if (!newTarget) return;
  const engine = document.querySelector('input[name=engine]:checked')?.value || 'claude';
  send({
    type: 'start_session', pc: newTarget.pc, project: newTarget.project, engine,
    model: $('model-select').value || null,
    prompt: $('new-prompt').value.trim(),
    resume: $('new-resume').value.trim() || null,
  });
  $('new-dialog').close();
});

/* ---------- 시작 ---------- */
if (token) connect(); else askToken();
</script>
